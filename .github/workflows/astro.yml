name: Deploy to Cloudflare (manual fallback)

# 主链路是 Cloudflare Workers Builds：推 main 由 CF 自己构建并部署，
# 见 AGENTS.md「部署」。这个 workflow 只作逃生口——CF 侧构建挂掉时手动
# Run workflow，仍能从仓库部署同一份代码，不必等 CF 修好。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build with Astro
        run: pnpm astro build --site "https://www.th-dd.top"

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
