name: Update GitHub Game & 3D Contrib

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: main

      - uses: czl9707/gh-space-shooter@b24c9792454d1a2e0139ccf72840424e1f83c3f2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'public/game.webp'
          strategy: 'random'
          no-commit: true
          fps: 40

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Prepare 3D SVG
        run: |
          if [ -f profile-3d-contrib/profile-night-rainbow.svg ]; then
            mv profile-3d-contrib/profile-night-rainbow.svg public/
          fi
          rm -rf profile-3d-contrib

      - name: Commit & Push remaining assets
        uses: IAreKyleW00t/verified-bot-commit@v2
        with:
          message: "chore: update game and 3D contrib"
          files: |
            public/**
            !public/.gitkeep
            
