name: Update GitHub Game & 3D Contrib

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: main

      - uses: czl9707/gh-space-shooter@b24c9792454d1a2e0139ccf72840424e1f83c3f2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'public/game.webp'
          strategy: 'random'
          no-commit: true
          fps: 40

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Prepare 3D SVG
        run: |
          if [ -f profile-3d-contrib/profile-night-rainbow.svg ]; then
            mv profile-3d-contrib/profile-night-rainbow.svg public/
          fi
          rm -rf profile-3d-contrib

      - name: Rasterize 3D graph for the site (SVG repaints are slow)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          python -m pip install --quiet pillow
          # librsvg 不跑 CSS 动画，柱子颜色全来自 @keyframes：改成静态彩虹——
          # 按柱子层级取色环的不同相位（l0 红 -> l4 蓝紫），保留主题自己的配色
          python - <<'PY'
          import re
          src = open('public/profile-night-rainbow.svg', encoding='utf-8').read()
          a = src.index('<style>') + len('<style>')
          b = src.index('</style>')
          body = src[a:b]
          phases = ['0.00%', '16.67%', '33.33%', '50.00%', '66.67%']
          colors = {}
          for chunk in re.split(r'@keyframes\s+', body)[1:]:
              name = re.match(r'([\w-]+)', chunk)
              lv = re.match(r'rb-l(\d)-(top|left)$', name.group(1)) if name else None
              if not lv:
                  continue
              hit = re.search(re.escape(phases[min(int(lv.group(1)), 4)]) + r'\{fill:(rgb\([^)]*\))', chunk)
              if hit:
                  colors[name.group(1)] = hit.group(1)
          body = re.sub(r'animation:[^;}]*;?', '', body)
          body += ''.join(f'.{k}{{fill:{v}}}' for k, v in colors.items())
          open('/tmp/p3d-static.svg', 'w', encoding='utf-8').write(src[:a] + body + src[b:])
          print('flattened classes:', len(colors))
          PY
          rsvg-convert -w 900 /tmp/p3d-static.svg -o /tmp/p3d.png
          python - <<'PY'
          from PIL import Image
          Image.open('/tmp/p3d.png').convert('RGB').save(
              'public/profile-night-rainbow.webp', 'WEBP', quality=82)
          PY

      - name: Shrink game.webp (keep all frames, lower resolution)
        continue-on-error: true
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import os, sys
          from PIL import Image

          SRC, TMP, WIDTH, QUALITY = 'public/game.webp', 'public/game.shrunk.webp', 420, 50
          if not os.path.exists(SRC):
              sys.exit(0)

          im = Image.open(SRC)
          frames, durations = [], []
          for i in range(im.n_frames):
              im.seek(i)
              frames.append(im.convert('RGB').resize(
                  (WIDTH, max(1, round(im.size[1] * WIDTH / im.size[0]))), Image.LANCZOS))
              durations.append(im.info.get('duration', 25))

          frames[0].save(TMP, 'WEBP', save_all=True, append_images=frames[1:],
                         duration=durations, loop=0, quality=QUALITY, method=5)

          before, after = os.path.getsize(SRC), os.path.getsize(TMP)
          print(f'game.webp: {before} -> {after} bytes')
          if after < before * 0.9:
              os.replace(TMP, SRC)
          else:
              os.remove(TMP)
              print('no real gain, kept the original')
          PY

      - name: Commit & Push remaining assets
        uses: IAreKyleW00t/verified-bot-commit@v2
        with:
          message: "chore: update game and 3D contrib"
          files: |
            public/**
            !public/.gitkeep
            
