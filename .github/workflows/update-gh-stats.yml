name: Update GitHub Game & 3D Contrib

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: main

      - uses: czl9707/gh-space-shooter@b24c9792454d1a2e0139ccf72840424e1f83c3f2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'public/game.webp'
          strategy: 'random'
          no-commit: true
          fps: 40

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Prepare 3D SVG
        run: |
          if [ -f profile-3d-contrib/profile-night-rainbow.svg ]; then
            mv profile-3d-contrib/profile-night-rainbow.svg public/
          fi
          rm -rf profile-3d-contrib

      - name: Shrink game.webp (keep all frames, lower resolution)
        continue-on-error: true
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import os, sys
          from PIL import Image

          SRC, TMP, WIDTH, QUALITY = 'public/game.webp', 'public/game.shrunk.webp', 420, 50
          if not os.path.exists(SRC):
              sys.exit(0)

          im = Image.open(SRC)
          frames, durations = [], []
          for i in range(im.n_frames):
              im.seek(i)
              frames.append(im.convert('RGB').resize(
                  (WIDTH, max(1, round(im.size[1] * WIDTH / im.size[0]))), Image.LANCZOS))
              durations.append(im.info.get('duration', 25))

          frames[0].save(TMP, 'WEBP', save_all=True, append_images=frames[1:],
                         duration=durations, loop=0, quality=QUALITY, method=5)

          before, after = os.path.getsize(SRC), os.path.getsize(TMP)
          print(f'game.webp: {before} -> {after} bytes')
          if after < before * 0.9:
              os.replace(TMP, SRC)
          else:
              os.remove(TMP)
              print('no real gain, kept the original')
          PY

      - name: Commit & Push remaining assets
        uses: IAreKyleW00t/verified-bot-commit@v2
        with:
          message: "chore: update game and 3D contrib"
          files: |
            public/**
            !public/.gitkeep
            